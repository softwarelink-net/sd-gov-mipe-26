# 本仓仅用于 R2 上传鉴权与本站资源绑定参考。
# 共享入口 Worker 名为 allworld；日常发布请用 `npm run deploy`（只写本站 R2 前缀），
# 切勿随意 `wrangler deploy` 覆盖共享 Worker，以免影响其他站点。
name = "allworld"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]
account_id = "57df712874237f41c6142eb723be3f21"
workers_dev = true

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "sd-gov-mipe-26-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
APP_NAME = "山东省住建厅2026年度系统密评项目"
PROJECT_SLUG = "sd-gov-mipe-26"
REPO_NAME = "sd-gov-mipe-26"
SITE_SLUG = "sd-gov-mipe-26"
DEPLOYMENT_HOST = "https://sd-gov-mipe-26.softwarelink.net/"
HOST_DOMAIN = "https://sd-gov-mipe-26.softwarelink.net"
ROOT_DOMAIN = "softwarelink.net"
SITE_HOST = "https://sd-gov-mipe-26.softwarelink.net/"
TABLE_PREFIX = "sd_mipe_"
R2_SITE_PREFIX = "allworld-sites/sd-gov-mipe-26/"
